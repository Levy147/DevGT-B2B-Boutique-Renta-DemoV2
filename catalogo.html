<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Catálogo · Lunette</title>
  <meta name="description" content="Explora el catálogo de Lunette: tops, faldas, hoodies, bolsas, accesorios y outfits Y2K / Coquette en Guatemala.">
  <link rel="stylesheet" href="public/css/main.css">
  <link rel="stylesheet" href="public/css/cliente.css">
  <link rel="stylesheet" href="public/css/lunette.css">
  <link rel="icon" href="public/img/lunette/mascot.png" type="image/png">
</head>
<body data-page="catalog">
  <div data-lf-nav></div>

  <main class="main-content">
    <div class="page-hero">
      <h1>Catálogo Lunette</h1>
      <p>Tops, faldas, hoodies, bolsas y accesorios para armar tu look Y2K / Coquette.</p>
    </div>

    <div class="container">
      <button class="btn btn-secondary btn-sm lf-filters-toggle" id="filtersToggle" type="button">☰ Filtros</button>

      <div class="catalog-layout">
        <aside class="filters-sidebar" id="filtersSidebar">
          <div class="filters-header">
            <h3>Filtros</h3>
            <button class="clear-filters" id="clearFilters" type="button">Limpiar todo ×</button>
          </div>

          <div class="filter-group">
            <label for="catalogSearch">Buscar</label>
            <input type="search" id="catalogSearch" placeholder="Top, falda, rosa…" autocomplete="off">
          </div>

          <div class="filter-group">
            <label>Categoría</label>
            <div class="filter-categories" id="filterCategorias"></div>
          </div>

          <div class="filter-group">
            <label>Color</label>
            <div class="color-swatches" id="filterColores"></div>
          </div>

          <div class="filter-group">
            <label>Talla</label>
            <div class="size-chips" id="filterTallas"></div>
          </div>

          <div class="filter-group">
            <label>Rango de precio (Q)</label>
            <div class="price-range-inputs">
              <input type="number" id="precioMin" placeholder="Min" min="0">
              <span>—</span>
              <input type="number" id="precioMax" placeholder="Max" min="0">
            </div>
          </div>

          <button class="btn btn-primary btn-block btn-sm" id="applyFilters" type="button">Aplicar filtros</button>
        </aside>

        <div>
          <div class="catalog-header">
            <span class="result-count" id="resultCount">Mostrando 0 productos</span>
            <select class="sort-select" id="sortSelect" aria-label="Ordenar productos">
              <option value="default">Ordenar por</option>
              <option value="precio-asc">Menor precio</option>
              <option value="precio-desc">Mayor precio</option>
              <option value="nombre">Nombre A-Z</option>
              <option value="rating">Mejor valorados</option>
            </select>
          </div>
          <div class="grid grid-3" id="catalogGrid"></div>
        </div>
      </div>
    </div>
  </main>

  <div data-lf-footer></div>
  <div data-lf-cart></div>

  <script src="public/js/lunette-data.js"></script>
  <script src="public/js/lunette-store.js?v=3"></script>
  <script src="public/js/lunette-pages.js"></script>
</body>
</html>
